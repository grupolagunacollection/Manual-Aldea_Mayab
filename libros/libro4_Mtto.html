<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Libro IV v12 — Mantenimiento · Aldea Mayab</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#F0EDE6;--surface:#FAFAF7;--white:#fff;
  --ink:#111810;--muted:#5A6054;--rule:#D6D8D0;
  --g1:#0C2B18;--g2:#145C30;--g3:#26854D;--g4:#5BB87A;--gs:#E4F2E9;
  --r1:#8B2318;--r2:#C0392B;--rs:#FDECEA;
  --a1:#7A4800;--a2:#C87D0A;--as:#FDF3E3;
  --b1:#1A3C5E;--b2:#2A6098;--bs:#EAF2FB;
  --font:'DM Sans',system-ui,sans-serif;
  --mono:'DM Mono',monospace;
  --r12:12px;--r16:16px;
  --shadow:0 2px 12px rgba(0,0,0,.08);
  --sidebar:282px;
  --tr:all .2s cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--ink);display:flex;min-height:100vh;font-size:15px;line-height:1.6}

/* SIDEBAR */
#sb{width:var(--sidebar);min-height:100vh;background:var(--g1);position:fixed;top:0;left:0;display:flex;flex-direction:column;z-index:100;overflow:hidden;transition:transform .28s cubic-bezier(.4,0,.2,1)}
.sb-brand{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
.sb-lbl{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--g4);margin-bottom:3px}
.sb-title{font-size:16px;font-weight:800;color:#fff;line-height:1.2}
.sb-code{font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.4);margin-top:3px}
.sb-nav{flex:1;overflow-y:auto;padding:6px 0 24px;overscroll-behavior:contain}
.sb-nav::-webkit-scrollbar{width:3px}
.sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:2px}
.sbg{margin-bottom:1px}
.sbg-btn{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;cursor:pointer;user-select:none;color:rgba(255,255,255,.55);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;transition:color .15s}
.sbg-btn:hover{color:#fff}
.sbg-btn .arr{font-size:8px;transition:transform .2s;flex-shrink:0}
.sbg.open .arr{transform:rotate(90deg)}
.sbg-items{display:none}
.sbg.open .sbg-items{display:block}
.sbi{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 22px;cursor:pointer;color:rgba(255,255,255,.5);font-size:12px;font-weight:500;border-left:3px solid transparent;transition:var(--tr);line-height:1.3}
.sbi:hover{color:#fff;background:rgba(255,255,255,.05)}
.sbi.active{color:var(--g4);border-left-color:var(--g4);background:rgba(91,184,122,.1);font-weight:700}
.sbi .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot-green{background:var(--g3)}.dot-red{background:var(--r2)}.dot-amber{background:var(--a2)}.dot-blue{background:var(--b2)}.dot-gray{background:#8A9A88}

/* MAIN */
#main{margin-left:var(--sidebar);flex:1;min-width:0}
#topbar{height:50px;background:rgba(250,250,247,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:50}
#crumb{font-size:13px;color:var(--muted)}#crumb strong{color:var(--ink)}
.tb-v{font-size:10px;font-weight:700;letter-spacing:.1em;background:var(--gs);color:var(--g2);padding:3px 8px;border-radius:4px}
#content{padding:18px}
.page{display:none;max-width:1000px;margin:0 auto}
.page.active{display:block;animation:fu .16s ease}
@keyframes fu{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* HAM */
#ham{display:none;position:fixed;top:10px;left:12px;z-index:200;background:var(--g1);border:none;border-radius:10px;padding:10px 12px;cursor:pointer;flex-direction:column;gap:5px;box-shadow:0 2px 16px rgba(0,0,0,.4)}
#ham span{display:block;width:20px;height:2px;background:var(--g4);border-radius:2px;transition:var(--tr)}
#ham.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
#ham.open span:nth-child(2){opacity:0}
#ham.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90}
#ov.on{display:block}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r16);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-hero{background:linear-gradient(135deg,var(--g1) 0%,var(--g2) 100%);color:#fff;border-color:transparent}
.card-hero .ey,.card-hero .ct{color:var(--g4)}
.card-hero .ct{font-size:26px;font-weight:800;line-height:1.2;margin-bottom:8px;color:#fff}
.card-hero p{color:rgba(255,255,255,.7);font-size:14px}
/* new: striped card for new chapters */
.card-new{border-left:4px solid var(--g4)}

/* TYPOGRAPHY */
.ey{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--g3);margin-bottom:5px}
.ct{font-size:20px;font-weight:800;line-height:1.2;margin-bottom:6px}
.ct-lg{font-size:26px}
.st{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.st .n{width:22px;height:22px;background:var(--g2);color:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0}
.st .n.r{background:var(--r2)}.st .n.a{background:var(--a2)}.st .n.b{background:var(--b2)}.st .n.g{background:var(--g3)}

/* CALLOUTS */
.co{border-radius:var(--r12);padding:12px 14px;display:flex;gap:11px;border:1px solid;margin:10px 0}
.co-i{font-size:17px;flex-shrink:0;margin-top:1px}
.co-b{font-size:13px;line-height:1.5}
.co-b strong{display:block;font-weight:700;margin-bottom:2px;font-size:13px}
.cg{background:var(--gs);border-color:#B0D8BC;color:#0C2B18}.cg .co-i,.cg strong{color:var(--g2)}
.ca{background:var(--as);border-color:#E8C88A;color:#3A2000}.ca .co-i,.ca strong{color:var(--a2)}
.cr{background:var(--rs);border-color:#F0C0BC;color:#3A0A08}.cr .co-i,.cr strong{color:var(--r2)}
.cb{background:var(--bs);border-color:#BDD4EC;color:#0D1F2D}.cb .co-i,.cb strong{color:var(--b2)}

/* CROSS-REF CALLOUT */
.co-xref{background:#F5F7F4;border-color:var(--rule);color:var(--muted);border-radius:var(--r12);padding:10px 14px;display:flex;gap:10px;border:1px solid;margin:10px 0;font-size:12px;align-items:flex-start}
.co-xref strong{color:var(--g2);font-size:12px;display:block;margin-bottom:2px}

/* TABLES */
.tw{border-radius:var(--r12);overflow:hidden;border:1px solid var(--rule);margin:10px 0;background:var(--white)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--g1);color:#fff;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:9px 11px;text-align:left}
thead.a th{background:var(--a1)}thead.r th{background:var(--r1)}thead.b th{background:var(--b1)}thead.g th{background:var(--g2)}
tbody tr:nth-child(odd){background:var(--white)}tbody tr:nth-child(even){background:#F5F7F4}
td{padding:9px 11px;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.45}
tr:last-child td{border-bottom:none}td strong{color:var(--g2)}
.bx{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700}
.bg{background:var(--gs);color:var(--g2)}.ba{background:var(--as);color:var(--a1)}.br{background:var(--rs);color:var(--r1)}.bb{background:var(--bs);color:var(--b1)}

/* STEPS */
.steps{list-style:none}
.steps li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13px;line-height:1.5}
.steps li:last-child{border-bottom:none}
.sn{width:24px;height:24px;background:var(--g2);color:#fff;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;margin-top:2px}
.sn.r{background:var(--r2)}.sn.a{background:var(--a2)}.sn.b{background:var(--b2)}
.ob{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--rs);color:var(--r2);padding:1px 5px;border-radius:3px;margin-left:4px}

/* CHECKLIST */
.cl{list-style:none}
.cl li{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:13px;line-height:1.45}
.cl li:last-child{border-bottom:none}
.cb2{width:17px;height:17px;border:2px solid var(--g3);border-radius:5px;flex-shrink:0;margin-top:2px;background:#fff}

/* GRIDS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:10px 0}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin:10px 0}
.kp{background:var(--white);border:1px solid var(--rule);border-radius:var(--r12);padding:12px}
.kp .v{font-size:18px;font-weight:900;color:var(--g2);line-height:1;margin-bottom:3px}
.kp .l{font-size:11px;color:var(--muted);font-weight:600}
.kp .s{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4}
.rl{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}
.rc{background:var(--white);border:1px solid var(--rule);border-top:3px solid var(--g2);border-radius:var(--r12);padding:12px}
.rc.r{border-top-color:var(--r2)}.rc.a{border-top-color:var(--a2)}.rc.b{border-top-color:var(--b2)}
.rt{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:3px}
.rs2{font-size:10px;font-weight:700;color:var(--g3);margin-bottom:5px;font-family:var(--mono)}
.rd{font-size:12px;color:var(--muted);line-height:1.4}

/* FLOW WRAP */
.fw{background:var(--white);border:1px solid var(--rule);border-radius:var(--r12);padding:18px;overflow-x:auto;margin:10px 0 22px;box-shadow:var(--shadow)}
.fw svg{max-width:100%;height:auto;display:block;margin:0 auto}
.fw-legend{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;align-items:center;font-size:10px;color:var(--muted);margin-top:14px;padding:10px 4px 0;border-top:1px dashed var(--rule);font-weight:500}
.fw-legend b{color:var(--ink);font-weight:700}
.fw-legend .fw-dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.fw-legend .fw-diamond{display:inline-block;width:9px;height:9px;transform:rotate(45deg);margin-right:5px;vertical-align:middle;border:1.5px solid var(--a2);background:var(--as)}

/* COVER TOC */
.cv-m{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:14px}
.cv-t{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:14px}
.ti{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:var(--r12);padding:11px 13px;cursor:pointer;transition:var(--tr)}
.ti:hover{background:rgba(255,255,255,.15)}
.ti-n{font-size:10px;font-weight:700;color:var(--g4);letter-spacing:.1em;text-transform:uppercase}
.ti-l{font-size:13px;font-weight:700;color:#fff;margin-top:2px}

/* CRITICAL BAND */
.cb3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:10px 0}
.cb3-i{border-radius:var(--r12);padding:11px;border:1px solid var(--rule);background:var(--white)}
.cb3-i strong{display:block;font-size:12px;margin-bottom:3px;color:var(--ink)}
.cb3-i span{display:block;font-size:11px;color:var(--muted);line-height:1.35}
.cb3-i.ok{border-left:4px solid var(--g3)}.cb3-i.warn{border-left:4px solid var(--a2)}.cb3-i.stop{border-left:4px solid var(--r2)}

/* SWIM */
.sw{border:1px solid var(--rule);border-radius:var(--r12);overflow:hidden;margin:10px 0;background:var(--white)}
.sw-r{display:grid;grid-template-columns:130px 1fr;border-bottom:1px solid var(--rule)}
.sw-r:last-child{border-bottom:none}
.sw-l{background:var(--gs);padding:11px;font-size:10px;font-weight:900;color:var(--g2);letter-spacing:.08em;text-transform:uppercase}
.sw-c{padding:11px;font-size:13px;line-height:1.5;color:var(--ink)}

/* EMERGENCY SWIM */
.esw{border:1px solid var(--rule);border-radius:var(--r12);overflow:hidden;margin:12px 0}
.esw-h{background:var(--r2);color:#fff;padding:9px 13px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.esw-g{display:grid;grid-template-columns:1fr 1fr 1fr}
.esw-gh{background:#1A1A1A;color:#fff;padding:8px 11px;font-size:10px;font-weight:700;text-align:center;letter-spacing:.06em;text-transform:uppercase;border-right:1px solid rgba(255,255,255,.1)}
.esw-gh:last-child{border-right:none}
.esw-c{padding:10px 11px;border-top:1px solid var(--rule);border-right:1px solid var(--rule);font-size:12px;line-height:1.45}
.esw-c:last-child{border-right:none}
.esw-c strong{display:block;font-size:11px;font-weight:800;color:var(--r2);margin-bottom:2px}
.who{display:inline-block;background:var(--gs);color:var(--g2);font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;margin-top:3px}
.who.r{background:var(--rs);color:var(--r2)}.who.a{background:var(--as);color:var(--a1)}

/* OP STRIP */
.os{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.os-c{background:var(--white);border:1px solid var(--rule);border-radius:var(--r12);padding:9px 11px}
.os-c .t{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--g3);margin-bottom:3px}
.os-c .v{font-size:12px;font-weight:800;color:var(--ink);line-height:1.25}

/* FREQ MATRIX */
.fm{border:1px solid var(--rule);border-radius:var(--r12);overflow:hidden;margin:10px 0}
.fm-head{background:var(--g1);color:#fff;display:grid;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.fm-row{display:grid;border-bottom:1px solid var(--rule);font-size:12px}
.fm-row:last-child{border-bottom:none}
.fm-row:nth-child(even){background:#F5F7F4}
.fm-row:nth-child(odd){background:var(--white)}
.fm-cell{padding:8px 10px;border-right:1px solid var(--rule)}
.fm-cell:last-child{border-right:none}
.fm-cell.freq{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.freq-d{color:var(--r2);background:var(--rs)}.freq-s{color:var(--a1);background:var(--as)}
.freq-q{color:var(--b2);background:var(--bs)}.freq-m{color:var(--g2);background:var(--gs)}
.freq-t{color:#4A2080;background:#F0EAFF}.freq-a{color:#1A1A1A;background:#E8E8E8}

/* FOOTER */
.pf{display:flex;justify-content:space-between;margin-top:18px;padding-top:10px;border-top:1px solid var(--rule);font-size:11px;color:var(--muted)}

/* RESPONSIVE */
@media(max-width:768px){
  #ham{display:flex}
  #sb{transform:translateX(-100%)}
  #sb.open{transform:translateX(0)}
  #main{margin-left:0!important}
  #topbar{padding:0 10px 0 50px}
  #content{padding:10px}
  .g2,.g3,.g4,.cv-m,.cv-t,.rl,.os,.cb3,.esw-g{grid-template-columns:1fr!important}
  .ct-lg{font-size:21px}
  .sw-r,.esw-g{grid-template-columns:1fr}
  .sw-l{border-bottom:1px solid var(--rule)}
  .esw-gh:not(:first-child){display:none}
  .esw-c{border-right:none}
  .fm-head,.fm-row{grid-template-columns:1fr!important}
  .fm-cell{border-right:none}
}
</style>

</head>

const R=(x,y,w,h,rx,f,s='#ccc',sw=1.5)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}" stroke="${s}" stroke-width="${sw}"/>`;
const T=(x,y,s,o={})=>{const{a='middle',f='#111',sz=11,w=700,i=false}=o;return `<text x="${x}" y="${y}" text-anchor="${a}" fill="${f}" font-size="${sz}" font-weight="${w}" ${i?'font-style="italic"':''}>${s}</text>`};
const AR=(id,c)=>`<marker id="${id}" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="${c}"/></marker>`;
const LN=(x1,y1,x2,y2,c,d='',m='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="2" ${d?`stroke-dasharray="${d}"`:''}  marker-end="url(#${m||'a_'+c.replace('#','')})"/>`;
const PL=(pts,c,d='',m='')=>`<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2" ${d?`stroke-dasharray="${d}"`:''}  marker-end="url(#${m||'a_'+c.replace('#','')})"/>`;
const BOX=(x,y,w,h,l,s2,f,s)=>R(x,y,w,h,8,f,s,1.5)+T(x+w/2,y+h/2-5,l,{sz:12,f:s,w:700})+T(x+w/2,y+h/2+10,s2,{sz:9,f:s+'AA',w:400});
const DM=(x,y,w,h,l,s2,f,s)=>{const cx=x+w/2,cy=y+h/2;const lbl=s2?T(cx,cy-2,l,{sz:10,f:s,w:700})+T(cx,cy+11,s2,{sz:8,f:s,w:400}):T(cx,cy+4,l,{sz:10,f:s,w:700});return `<polygon points="${cx},${y} ${x+w},${cy} ${cx},${y+h} ${x},${cy}" fill="${f}" stroke="${s}" stroke-width="1.75"/>${lbl}`};

// ── BUILD NAV ──
function buildNav(){
  const groups={};
  NAV.forEach(it=>{if(!groups[it.group])groups[it.group]=[];groups[it.group].push(it);});
  const openGroups=['Libro IV','1.0 Marco General','2.0 PTAR','3.0 Agua Potable'];
  document.getElementById('sb-nav').innerHTML=Object.entries(groups).map(([g,items])=>`
    <div class="sbg ${openGroups.includes(g)?'open':''}">
      <div class="sbg-btn" onclick="this.parentElement.classList.toggle('open')">
        <span>${g}</span><span class="arr">▶</span>
      </div>
      <div class="sbg-items">
        ${items.map(it=>`<div class="sbi" id="nav-${it.id}" onclick="show('${it.id}')"><span class="dot dot-${it.dot}"></span>${it.label}</div>`).join('')}
      </div>
    </div>`).join('');
}

// ── BUILD PAGES ──
function buildPages(){
  document.getElementById('content').innerHTML=Object.entries(PAGES).map(([id,fn])=>`<div class="page" id="page-${id}">${fn()}</div>`).join('');
}

// ── SHOW ──
const CRUMBS={};
NAV.forEach(it=>{CRUMBS[it.id]=it.label;});
CRUMBS.cover='Portada';
function show(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.sbi').forEach(n=>n.classList.remove('active'));
  const pg=document.getElementById('page-'+id);if(pg)pg.classList.add('active');
  const nv=document.getElementById('nav-'+id);if(nv)nv.classList.add('active');
  document.getElementById('crumb').innerHTML=`Libro IV › <strong>${CRUMBS[id]||id}</strong>`;
  window.scrollTo({top:0,behavior:'smooth'});
  if(window.innerWidth<=768)closeSB();
}
// ── HAMBURGER ──
function toggleSB(){document.getElementById('sb').classList.toggle('open');document.getElementById('ham').classList.toggle('open');document.getElementById('ov').classList.toggle('on');}
function closeSB(){document.getElementById('sb').classList.remove('open');document.getElementById('ham').classList.remove('open');document.getElementById('ov').classList.remove('on');}
document.getElementById('ham').addEventListener('click',toggleSB);
document.getElementById('ov').addEventListener('click',closeSB);
// ── INIT ──
function handleDeepLink(){
  const id=window.location.hash.replace('#','');
  show(PAGES[id]?id:'cover');
}
buildNav();buildPages();handleDeepLink();
window.addEventListener('hashchange',handleDeepLink);
</script>
</body>
</html>
