<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Libro IV — Mantenimiento · Aldea Mayab</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ── TOKENS ── */
:root {
  --bg:#F0EDE6; --surface:#FAFAF7; --white:#FFFFFF;
  --ink:#111810; --muted:#5A6054; --rule:#D6D8D0;
  --g1:#0C2B18; --g2:#145C30; --g3:#26854D; --g4:#5BB87A; --g-soft:#E4F2E9;
  --r1:#8B2318; --r2:#C0392B; --r-soft:#FDECEA;
  --a1:#7A4800; --a2:#C87D0A; --a-soft:#FDF3E3;
  --b1:#1A3C5E; --b2:#2A6098; --b-soft:#EAF2FB;
  --p1:#4A2080; --p-soft:#F0EAFF;
  --font:'DM Sans',system-ui,sans-serif;
  --mono:'DM Mono',monospace;
  --r4:4px; --r8:8px; --r12:12px; --r16:16px; --r20:20px; --r24:24px;
  --shadow:0 2px 12px rgba(0,0,0,.08);
  --shadow-lg:0 8px 32px rgba(0,0,0,.12);
  --sidebar:280px;
  --transition:all .2s cubic-bezier(.4,0,.2,1);
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html { scroll-behavior:smooth; }
body { font-family:var(--font); background:var(--bg); color:var(--ink); display:flex; min-height:100vh; font-size:15px; line-height:1.6; }

/* ── SIDEBAR ── */
#sidebar {
  width:var(--sidebar); min-height:100vh; background:var(--g1);
  position:fixed; top:0; left:0; display:flex; flex-direction:column;
  z-index:100; overflow:hidden; transition:transform .28s cubic-bezier(.4,0,.2,1);
}
.sb-brand { padding:20px 16px 16px; border-bottom:1px solid rgba(255,255,255,.1); }
.sb-label { font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--g4); margin-bottom:4px; }
.sb-title { font-size:17px; font-weight:800; color:#fff; line-height:1.25; }
.sb-code { font-family:var(--mono); font-size:10px; color:rgba(255,255,255,.45); margin-top:4px; }
.sb-nav { flex:1; overflow-y:auto; padding:8px 0 24px; overscroll-behavior:contain; }
.sb-nav::-webkit-scrollbar { width:3px; }
.sb-nav::-webkit-scrollbar-thumb { background:rgba(255,255,255,.15); border-radius:2px; }
.sb-group { margin-bottom:2px; }
.sb-group-btn {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 16px; cursor:pointer; user-select:none;
  color:rgba(255,255,255,.6); font-size:11px; font-weight:700;
  letter-spacing:.08em; text-transform:uppercase;
  transition:color .15s;
}
.sb-group-btn:hover { color:#fff; }
.sb-group-btn .arr { font-size:8px; transition:transform .2s; flex-shrink:0; }
.sb-group.open .arr { transform:rotate(90deg); }
.sb-items { display:none; }
.sb-group.open .sb-items { display:block; }
.sb-item {
  display:flex; align-items:center; gap:8px;
  padding:9px 16px 9px 24px; cursor:pointer;
  color:rgba(255,255,255,.55); font-size:13px; font-weight:500;
  border-left:3px solid transparent; transition:var(--transition);
  line-height:1.3;
}
.sb-item:hover { color:#fff; background:rgba(255,255,255,.05); }
.sb-item.active { color:var(--g4); border-left-color:var(--g4); background:rgba(91,184,122,.1); font-weight:700; }
.sb-item .dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }

/* ── MAIN ── */
#main { margin-left:var(--sidebar); flex:1; min-width:0; }
#topbar {
  height:52px; background:rgba(250,250,247,.95); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--rule); display:flex; align-items:center;
  justify-content:space-between; padding:0 20px; position:sticky; top:0; z-index:50;
}
#breadcrumb { font-size:13px; color:var(--muted); }
#breadcrumb strong { color:var(--ink); }
.tb-badge { font-size:10px; font-weight:700; letter-spacing:.1em; background:var(--g-soft); color:var(--g2); padding:3px 8px; border-radius:4px; }

/* ── PAGES ── */
#content { padding:20px; }
.page { display:none; max-width:980px; margin:0 auto; }
.page.active { display:block; animation:fadeUp .18s ease; }
@keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }

/* ── HAMBURGER ── */
#ham {
  display:none; position:fixed; top:10px; left:12px; z-index:200;
  background:var(--g1); border:none; border-radius:10px; padding:11px 13px;
  cursor:pointer; flex-direction:column; gap:5px; box-shadow:0 2px 16px rgba(0,0,0,.4);
}
#ham span { display:block; width:20px; height:2px; background:var(--g4); border-radius:2px; transition:var(--transition); }
#ham.open span:nth-child(1) { transform:translateY(7px) rotate(45deg); }
#ham.open span:nth-child(2) { opacity:0; }
#ham.open span:nth-child(3) { transform:translateY(-7px) rotate(-45deg); }
#overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:90; }
#overlay.on { display:block; }

/* ── CARDS ── */
.card { background:var(--surface); border:1px solid var(--rule); border-radius:var(--r16); padding:20px; margin-bottom:16px; box-shadow:var(--shadow); }
.card-hero { background:linear-gradient(135deg,var(--g1) 0%,var(--g2) 100%); color:#fff; border-color:transparent; }
.card-hero .eyebrow { color:var(--g4); }
.card-hero .card-title { color:#fff; }
.card-hero p { color:rgba(255,255,255,.7); }

/* ── TYPOGRAPHY ── */
.eyebrow { font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--g3); margin-bottom:6px; }
.card-title { font-size:22px; font-weight:800; line-height:1.2; margin-bottom:8px; }
.card-title.lg { font-size:28px; }
.section-title { font-size:16px; font-weight:700; color:var(--ink); margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.section-title .num { width:24px; height:24px; background:var(--g2); color:#fff; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; flex-shrink:0; }
.section-title .num.red { background:var(--r2); }
.section-title .num.amber { background:var(--a2); }
.section-title .num.blue { background:var(--b2); }

/* ── CALLOUTS ── */
.callout { border-radius:var(--r12); padding:14px 16px; display:flex; gap:12px; border:1px solid; margin:12px 0; }
.callout-icon { font-size:18px; flex-shrink:0; margin-top:1px; }
.callout-body { font-size:13px; line-height:1.55; }
.callout-body strong { display:block; font-weight:700; margin-bottom:3px; font-size:13px; }
.c-green { background:var(--g-soft); border-color:#B0D8BC; color:#0C2B18; }
.c-green .callout-icon,.c-green strong { color:var(--g2); }
.c-amber { background:var(--a-soft); border-color:#E8C88A; color:#3A2000; }
.c-amber .callout-icon,.c-amber strong { color:var(--a2); }
.c-red { background:var(--r-soft); border-color:#F0C0BC; color:#3A0A08; }
.c-red .callout-icon,.c-red strong { color:var(--r2); }
.c-blue { background:var(--b-soft); border-color:#BDD4EC; color:#0D1F2D; }
.c-blue .callout-icon,.c-blue strong { color:var(--b2); }

/* ── TABLES ── */
.table-wrap { border-radius:var(--r12); overflow:hidden; border:1px solid var(--rule); margin:12px 0; background:var(--white); }
table { width:100%; border-collapse:collapse; font-size:13px; }
thead th { background:var(--g1); color:#fff; font-size:10px; letter-spacing:.1em; text-transform:uppercase; padding:10px 12px; text-align:left; }
thead.amber th { background:var(--a1); }
thead.red th { background:var(--r1); }
thead.blue th { background:var(--b1); }
tbody tr:nth-child(odd) { background:var(--white); }
tbody tr:nth-child(even) { background:#F5F7F4; }
td { padding:10px 12px; border-bottom:1px solid var(--rule); vertical-align:top; line-height:1.45; }
tr:last-child td { border-bottom:none; }
td strong { color:var(--g2); }
.badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:700; }
.badge-g { background:var(--g-soft); color:var(--g2); }
.badge-a { background:var(--a-soft); color:var(--a1); }
.badge-r { background:var(--r-soft); color:var(--r1); }
.badge-b { background:var(--b-soft); color:var(--b1); }

/* ── STEPS ── */
.steps { list-style:none; }
.steps li { display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--rule); font-size:14px; line-height:1.5; }
.steps li:last-child { border-bottom:none; }
.step-n { width:26px; height:26px; background:var(--g2); color:#fff; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; flex-shrink:0; margin-top:2px; }
.step-n.red { background:var(--r2); }
.step-n.amber { background:var(--a2); }
.oblig { font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; background:var(--r-soft); color:var(--r2); padding:1px 5px; border-radius:3px; margin-left:4px; }

/* ── CHECKLIST ── */
.checklist { list-style:none; }
.checklist li { display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--rule); font-size:14px; line-height:1.45; }
.checklist li:last-child { border-bottom:none; }
.ch-box { width:18px; height:18px; border:2px solid var(--g3); border-radius:5px; flex-shrink:0; margin-top:2px; background:#fff; }

/* ── GRID CARDS ── */
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:12px 0; }
.grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin:12px 0; }
.kpi { background:var(--white); border:1px solid var(--rule); border-radius:var(--r12); padding:14px; }
.kpi .kpi-val { font-size:20px; font-weight:900; color:var(--g2); line-height:1; margin-bottom:4px; }
.kpi .kpi-label { font-size:11px; color:var(--muted); font-weight:600; }
.kpi .kpi-sub { font-size:11px; color:var(--muted); margin-top:4px; line-height:1.4; }

/* ── ROLE CARDS ── */
.roles { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0; }
.role-card { background:var(--white); border:1px solid var(--rule); border-top:3px solid var(--g2); border-radius:var(--r12); padding:14px; }
.role-card.red-top { border-top-color:var(--r2); }
.role-card.amber-top { border-top-color:var(--a2); }
.role-card.blue-top { border-top-color:var(--b2); }
.role-title { font-size:13px; font-weight:800; color:var(--ink); margin-bottom:4px; }
.role-sch { font-size:11px; font-weight:700; color:var(--g3); margin-bottom:6px; font-family:var(--mono); }
.role-desc { font-size:12px; color:var(--muted); line-height:1.45; }

/* ── FLOW WRAP ── */
.flow-wrap { background:var(--white); border:1px solid var(--rule); border-radius:var(--r12); padding:16px; overflow-x:auto; margin:12px 0; }
.flow-wrap svg { max-width:100%; height:auto; display:block; }

/* ── DIAGRAM LEGEND ── */
.legend { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
.legend-item { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); }
.legend-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }

/* ── COVER PAGE ── */
.cover-meta { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:16px; }
.cover-toc { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px; }
.toc-item { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); border-radius:var(--r12); padding:12px 14px; cursor:pointer; transition:var(--transition); }
.toc-item:hover { background:rgba(255,255,255,.15); }
.toc-num { font-size:10px; font-weight:700; color:var(--g4); letter-spacing:.1em; text-transform:uppercase; }
.toc-label { font-size:13px; font-weight:700; color:#fff; margin-top:2px; }

/* ── FOOTER ── */
.page-footer { display:flex; justify-content:space-between; margin-top:20px; padding-top:12px; border-top:1px solid var(--rule); font-size:11px; color:var(--muted); }

/* ── COLORS FOR DOTS ── */
.dot-green { background:var(--g3); }
.dot-red { background:var(--r2); }
.dot-amber { background:var(--a2); }
.dot-blue { background:var(--b2); }
.dot-gray { background:#AAB0A8; }

/* ── ORG CHART CONTAINER ── */
.org-wrap { overflow-x:auto; padding:8px 0; }

/* ── RESPONSIVE ── */
@media (max-width:768px) {
  :root { --sidebar:280px; }
  #ham { display:flex; }
  #sidebar { transform:translateX(-100%); }
  #sidebar.open { transform:translateX(0); }
  #main { margin-left:0 !important; }
  #topbar { padding:0 12px 0 52px; }
  #content { padding:12px; }
  .grid2,.grid3,.cover-meta,.cover-toc,.roles { grid-template-columns:1fr !important; }
  .card-title.lg { font-size:22px; }
}
</style>
</head>
<body>

<!-- HAMBURGER -->
<button id="ham" aria-label="Menú"><span></span><span></span><span></span></button>
<div id="overlay"></div>

<!-- SIDEBAR -->
<aside id="sidebar">
  <div class="sb-brand">
    <div class="sb-label">Aldea Mayab · Bacalar</div>
    <div class="sb-title">Libro IV<br>Mantenimiento</div>
    <div class="sb-code">PR-AM-MNT-001 · v2.0 · 2026</div>
  </div>
  <nav class="sb-nav" id="sb-nav"></nav>
</aside>

<!-- MAIN -->
<div id="main">
  <div id="topbar">
    <div id="breadcrumb">Libro IV › <strong>Portada</strong></div>
    <span class="tb-badge">v2.0</span>
  </div>
  <div id="content"></div>
</div>

<script>
// ── NAV DATA ──
const NAV = [
  { id:'cover', group:'Libro IV', label:'Portada', dot:'green' },
  { id:'p11', group:'1.0 Marco General', label:'1.1 Alcance y Responsables', dot:'green' },
  { id:'p12', group:'1.0 Marco General', label:'1.2 Ciclo de Mantenimiento', dot:'green' },
  { id:'p21', group:'2.0 PTAR', label:'2.1 Inspección Diaria', dot:'amber' },
  { id:'p22', group:'2.0 PTAR', label:'2.2 Anomalías y Escalamiento', dot:'red' },
  { id:'p30', group:'3.0 Agua Potable', label:'3.0 Sistema — Diagrama', dot:'blue' },
  { id:'p31', group:'3.0 Agua Potable', label:'3.1 Lecturas Diarias', dot:'blue' },
  { id:'p32', group:'3.0 Agua Potable', label:'3.2 Ciclo Aquatrol y Sal', dot:'blue' },
  { id:'p33', group:'3.0 Agua Potable', label:'3.3 Dureza y Contingencias', dot:'blue' },
  { id:'p41', group:'4.0 Infraestructura', label:'4.1 Sistema Eléctrico', dot:'amber' },
  { id:'p42', group:'4.0 Infraestructura', label:'4.2 Pluma CAME', dot:'amber' },
  { id:'p43', group:'4.0 Infraestructura', label:'4.3 Generador', dot:'red' },
  { id:'p51', group:'5.0 Amenidades', label:'5.1 Albercas — Rutina', dot:'blue' },
  { id:'p52', group:'5.0 Amenidades', label:'5.2 Albercas — Parámetros', dot:'blue' },
  { id:'p53', group:'5.0 Amenidades', label:'5.3 Pádel', dot:'green' },
  { id:'p54', group:'5.0 Amenidades', label:'5.4 Firepit', dot:'amber' },
  { id:'p55', group:'5.0 Amenidades', label:'5.5 Muelle y Laguna', dot:'green' },
  { id:'p61', group:'6.0 Limpieza', label:'6.1 Residuos Sólidos', dot:'green' },
  { id:'p62', group:'6.0 Limpieza', label:'6.2 Áreas Comunes', dot:'green' },
  { id:'p63', group:'6.0 Limpieza', label:'6.3 Áreas Verdes', dot:'green' },
  { id:'p71', group:'7.0 Estacionamiento', label:'7.1 Cajones y Vialidad', dot:'gray' },
  { id:'p72', group:'7.0 Estacionamiento', label:'7.2 Proveedores', dot:'gray' },
  { id:'p81', group:'8.0 KPIs', label:'8.1 Indicadores', dot:'blue' },
  { id:'p82', group:'8.0 KPIs', label:'8.2 Reporte Mensual', dot:'blue' },
];

// ── SVG HELPERS ──
const M = (x,y)=>`M${x},${y}`;
const L = (x,y)=>`L${x},${y}`;
function rect(x,y,w,h,r,fill,stroke='#ccc',sw=1.5){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`}
function text(x,y,t,opts={}){const{anchor='middle',fill='#111',size=11,weight=700,italic=false}=opts;return `<text x="${x}" y="${y}" text-anchor="${anchor}" fill="${fill}" font-size="${size}" font-weight="${weight}" ${italic?'font-style="italic"':''}>${t}</text>`}
function arrow(id,color){return `<marker id="${id}" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="${color}"/></marker>`}
function line(x1,y1,x2,y2,color,dash='',mid=''){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="2" ${dash?`stroke-dasharray="${dash}"`:''}  marker-end="url(#arr_${mid||color.replace('#','')})"/>`}
function poly(pts,color,dash='',mid=''){return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" ${dash?`stroke-dasharray="${dash}"`:''}  marker-end="url(#arr_${mid||color.replace('#','')})"/>`}

// ── ORGCHART: ROLES ──
function orgRoles(){
  const W=700, H=340;
  const bg = (x,y,w,h,fill,stroke,label,sublabel,extra='')=>
    rect(x,y,w,h,8,fill,stroke,1.5)+text(x+w/2,y+h/2-6,label,{size:12,fill:stroke})+
    text(x+w/2,y+h/2+11,sublabel,{size:10,fill:stroke+'99',weight:400})+extra;

  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="DM Sans,sans-serif" style="max-width:100%;height:auto;">
  <defs>${arrow('org_g','#145C30')}${arrow('org_a','#C87D0A')}</defs>
  <!-- Title -->
  ${rect(0,0,W,36,0,'#0C2B18','transparent')}
  ${text(W/2,23,'Organigrama Funcional — Mantenimiento',{size:13,fill:'#fff'})}
  <!-- Dirección -->
  ${bg(260,52,180,42,'#E4F2E9','#145C30','Dirección General','Aprueba >$50K')}
  <!-- Gerencia -->
  ${bg(260,130,180,42,'#E4F2E9','#145C30','Gerencia Administrativa','Aprueba $20K–$50K')}
  <!-- Jefe -->
  ${bg(260,208,180,48,'#0C2B18','#0C2B18','Jefe de Mantenimiento','Aprueba ≤$20K · Lun–Vie 06–14h','')
    .replace('fill="#0C2B18" font-size="12"','fill="#fff" font-size="12"')
    .replace('fill="#0C2B1899"','fill="rgba(255,255,255,.6)"')}
  <!-- Personas nivel 3 -->
  ${bg(20,292,130,40,'#F5F7F4','#5A6054','Personal Mant.','Lun–Dom 06–15h')}
  ${bg(160,292,130,40,'#F5F7F4','#5A6054','Personal Limpieza','Lun–Dom 07–16h')}
  ${bg(400,292,130,40,'#F5F7F4','#5A6054','Proveedor Externo','Según contrato')}
  ${bg(540,292,140,40,'#F5F7F4','#5A6054','Guardia / Seguridad','24 horas')}
  <!-- Flechas verticales -->
  ${line(350,94,350,129,'#145C30','','org_g')}
  ${line(350,172,350,207,'#145C30','','org_g')}
  <!-- Jefe a personal -->
  ${poly('350,256 350,272 85,272 85,291','#5A6054','','org_a')}
  ${poly('350,256 350,272 225,272 225,291','#5A6054','','org_a')}
  ${poly('350,256 350,272 465,272 465,291','#5A6054','','org_a')}
  ${poly('350,256 350,272 610,272 610,291','#5A6054','','org_a')}
  </svg>`;
}

// ── FLOWCHART: ORDER CYCLE ──
function flowOrderCycle(){
  const W=680, H=540;
  const box=(x,y,w,h,label,sub,fill,stroke)=>
    rect(x,y,w,h,8,fill,stroke,1.5)+
    text(x+w/2,y+h/2-5,label,{size:12,fill:stroke,weight:700})+
    text(x+w/2,y+h/2+11,sub,{size:10,fill:stroke+'AA',weight:400});
  const diam=(x,y,w,h,label,fill,stroke)=>{
    const cx=x+w/2,cy=y+h/2;
    return `<polygon points="${cx},${y} ${x+w},${cy} ${cx},${y+h} ${x},${cy}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>
    ${text(cx,cy+4,label,{size:10,fill:stroke,weight:700})}`;
  };
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="DM Sans,sans-serif" style="max-width:100%;height:auto;">
  <defs>${arrow('g','#145C30')}${arrow('r','#C0392B')}${arrow('a','#C87D0A')}</defs>
  <!-- START -->
  ${rect(230,10,220,34,17,'#0C2B18','transparent')}
  ${text(340,32,'DETECTAR HALLAZGO',{size:11,fill:'#fff'})}
  <!-- Registrar -->
  ${box(230,62,220,42,'Registrar en AppSheet','Foto + hora + área','#E4F2E9','#145C30')}
  <!-- ¿Crítico? -->

// ── BUILD NAV ──
function buildNav(){
  const groups = {};
  NAV.forEach(item => {
    if(!groups[item.group]) groups[item.group] = [];
    groups[item.group].push(item);
  });
  const nav = document.getElementById('sb-nav');
  nav.innerHTML = Object.entries(groups).map(([grp, items]) => `
    <div class="sb-group ${['Libro IV','1.0 Marco General','2.0 PTAR','3.0 Agua Potable'].includes(grp)?'open':''}">
      <div class="sb-group-btn" onclick="this.parentElement.classList.toggle('open')">
        <span>${grp}</span><span class="arr">▶</span>
      </div>
      <div class="sb-items">
        ${items.map(it=>`<div class="sb-item" id="nav-${it.id}" onclick="show('${it.id}')">
          <span class="dot dot-${it.dot}"></span>${it.label}
        </div>`).join('')}
      </div>
    </div>`).join('');
}

// ── RENDER ALL PAGES ──
function buildPages(){
  const content = document.getElementById('content');
  content.innerHTML = Object.entries(PAGES).map(([id, fn]) =>
    `<div class="page" id="page-${id}">${fn()}</div>`
  ).join('');
}

// ── SHOW PAGE ──
const CRUMBS = {};
NAV.forEach(it => { CRUMBS[it.id] = it.label; });
CRUMBS['cover'] = 'Portada';

function show(id){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.sb-item').forEach(n => n.classList.remove('active'));
  const page = document.getElementById('page-'+id);
  if(page) { page.classList.add('active'); }
  const nav = document.getElementById('nav-'+id);
  if(nav) { nav.classList.add('active'); }
  document.getElementById('breadcrumb').innerHTML = `Libro IV › <strong>${CRUMBS[id]||id}</strong>`;
  window.scrollTo({top:0, behavior:'smooth'});
  if(window.innerWidth <= 768) closeSidebar();
}

// ── HAMBURGER ──
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('ham').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('on');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('ham').classList.remove('open');
  document.getElementById('overlay').classList.remove('on');
}
document.getElementById('ham').addEventListener('click', toggleSidebar);
document.getElementById('overlay').addEventListener('click', closeSidebar);

// ── INIT ──
buildNav();
buildPages();
show('cover');
</script>
